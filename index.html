<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Valine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg"></div>

<div class="live-payment" id="livePayment">
  Someone paid Rp50.000 via QRIS
</div>

<div class="ads-container no-glass">
  <div class="ads-slide">
    <img src="assets/iklan1.jpg">
    <img src="assets/iklan2.jpg">
    <img src="assets/iklan3.jpg">
  </div>
</div>

<div id="adsDots"></div>

<div class="main">
  <div class="card">

    <h1>VALINE</h1>
    <p class="subtitle">Payment & Official Links</p>

    <div class="counter">
      <span>📎 Salin: <b id="copyCount">0</b></span>
      <span>🌐 Social: <b id="socialClick">0</b></span>
    </div>

    <div class="payment">

      <div class="payment-status">
        <span class="dot"></span>
        PAYMENT GATEWAY ACTIVE
      </div>

      <img id="payIcon" src="assets/dana.jpg">
      <p id="payName">Dana</p>
      <p id="payNumber">087872748734</p>

      <button id="copyBtn">📎 Salin Nomor</button>

      <div class="invoice-box">
        <input type="number" id="amountInput" placeholder="Masukkan nominal">
        <button onclick="createInvoice()">Buat Invoice</button>
      </div>

      <div id="invoiceResult" class="invoice-result"></div>

      <div class="switch">
        <button onclick="prevPay()">‹ Kiri</button>
        <button onclick="nextPay()">Kanan ›</button>
      </div>

    </div>

    <div class="social">

      <a href="https://chat.whatsapp.com/FbZABeibky3Er6iIzHAQQL?mode=gi_t" onclick="incrementSocial()">
        <img src="svg/whatsapp.svg">
        <span>Group</span>
      </a>

      <a href="https://whatsapp.com/channel/0029Vb7W0LHJUM2jP4wOng1x" onclick="incrementSocial()">
        <img src="svg/channel.svg">
        <span>Saluran</span>
      </a>

      <a href="#">
        <img src="svg/tiktok.svg">
        <span>TikTok<br>Maintenance</span>
      </a>

      <a href="https://youtube.com/@AkariValinee" onclick="incrementSocial()">
        <img src="svg/youtube.svg">
        <span>YouTube</span>
      </a>

    </div>

  </div>
</div>

<div id="qrModal" class="qr-modal" onclick="closeQR()">
  <img id="qrBig" src="assets/qris.png">
  <p>Klik di mana saja untuk menutup</p>
</div>

<audio id="tingSound">
  <source src="assets/ting.mp3" type="audio/mpeg">
</audio>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getDatabase } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC98TkQYLipSzloE_St46XA4O1rv2rzT20",
    authDomain: "valine-b06ad.firebaseapp.com",
    databaseURL: "https://valine-b06ad-default-rtdb.firebaseio.com",
    projectId: "valine-b06ad",
    storageBucket: "valine-b06ad.appspot.com",
    messagingSenderId: "188820674947",
    appId: "1:188820674947:web:450cdc461e7ced7d04beb6",
    measurementId: "G-01TR04E4YT"
  };

  const app = initializeApp(firebaseConfig);
  window.database = getDatabase(app);
</script>

<script type="module" src="script.js"></script>
</body>
</html>
